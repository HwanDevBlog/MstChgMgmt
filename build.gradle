plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hwandevblog'
version = '0.1.0-SNAPSHOT'
description = 'Equipment catalog change validation and approval toy project'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.14.0')
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    environment 'LC_ALL', 'C'
    environment 'LANG', 'C'
}

// 프론트엔드 빌드 결과를 포함해 하나의 로컬 웹 서버로 시연할 수 있게 한다.
tasks.named('processResources') {
    from('frontend/dist') { into 'static' }
}

// 시연 DB는 고정 데이터 디렉터리를 사용해 종료 후에도 요청과 기준정보를 보존한다.
tasks.register('localRun', JavaExec) {
    group = 'application'
    description = 'Runs the application with a persistent local PostgreSQL database.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.hwandevblog.mstchgmgmt.LocalApplication'
    environment 'LC_ALL', 'C'
    environment 'LANG', 'C'
    workingDir projectDir
}
